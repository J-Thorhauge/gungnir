controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - velocity

    state_interfaces:
      - position
      - velocity
    
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      joint_1: { trajectory: 0.5, goal: 0.02 }
      joint_2: { trajectory: 0.5, goal: 0.02 }
      joint_3: { trajectory: 0.5, goal: 0.02 }
      joint_4: { trajectory: 0.5, goal: 0.02 }
      joint_5: { trajectory: 0.5, goal: 0.02 }
      joint_6: { trajectory: 0.5, goal: 0.02 }

    gains:
      joint_1: {p: 1.0, d: 0.0, ff_velocity_scale: 1.0}
      joint_2: {p: 1.0, d: 0.0, ff_velocity_scale: 1.0}
      joint_3: {p: 1.0, d: 0.0, ff_velocity_scale: 1.0}
      joint_4: {p: 1.0, d: 0.0, ff_velocity_scale: 1.0}
      joint_5: {p: 1.0, d: 0.0, ff_velocity_scale: 1.0}
      joint_6: {p: 1.0, d: 0.0, ff_velocity_scale: 1.0}
